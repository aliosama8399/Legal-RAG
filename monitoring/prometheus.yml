global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  # Alerting rules, including the faithfulness < 0.80 quality gate.
  - /etc/prometheus/monitoring/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "legal-rag"
    static_configs:
      - targets: ["bento-api:3000"]
    metrics_path: /api/v1/metrics
