apiVersion: 1

datasources:
  - name: Prometheus
    # Pinned so the dashboard JSON's `uid` matches; Grafana would otherwise
    # generate one and every panel would show "datasource not found".
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
