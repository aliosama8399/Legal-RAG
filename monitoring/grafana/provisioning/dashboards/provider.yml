apiVersion: 1

providers:
  - name: rag-dashboards
    orgId: 1
    folder: Legal-RAG
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      # Mounted separately from /etc/grafana/provisioning so this file is not
      # shadowed by the dashboard bind mount.
      path: /etc/grafana/dashboards
