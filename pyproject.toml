[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-rag"
version = "0.1.0"
description = "Arabic legal RAG over the Egyptian Civil Code — MLOps final project (LLM/RAG track)"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=5.1",
    "pdfplumber>=0.11",
    "PyMuPDF>=1.24",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.4",
    "sentence-transformers>=3.0",
    "datasets>=2.19",
    "qdrant-client>=1.10",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "openai>=1.0",
    "orjson>=3.10",
    "prometheus-client>=0.20",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "dvc>=3.50",
    "locust>=2.29",
    "ragas>=0.4",
    "langfuse>=2.50",
]
serve = [
    "bentoml>=1.3",
    # bentoml's `fs` dependency imports pkg_resources at import time;
    # setuptools 81+ removed pkg_resources — pin below the removal.
    "setuptools>=68,<81",
    # uvicorn's websockets protocol reads websockets.__version__, which
    # websockets 14+ removed — pin below it.
    "websockets>=10.4,<14",
]
mlops = [
    "mlflow>=2.14,<3",
    "ragas>=0.2",
    "bentoml>=1.3",
    "langfuse>=2.50",
    "prometheus-client>=0.20",
    "presidio-analyzer>=2.2",
    "evidently>=0.4",
]

[project.scripts]
legal-rag = "legal_rag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py312"
