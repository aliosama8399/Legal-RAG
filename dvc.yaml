stages:
  build_corpus:
    cmd: python src/data/prepare_law.py src/data/raw/egyptian_civil_code.pdf --output-dir src/data/processed
    deps:
      - src/data/raw/egyptian_civil_code.pdf
      - src/data/prepare_law.py
    outs:
      - src/data/processed/law_articles.jsonl
      - src/data/processed/law_chunks.jsonl