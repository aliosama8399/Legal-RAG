# --- canary begin (removed by the entrypoint when CANARY_SPLIT_PERCENT=0) ---
# CANARY_SPLIT_PERCENT is substituted by docker-entrypoint-ui.sh. nginx rejects
# split_clients at exactly "0%", so this whole region is deleted rather than
# rendered with a zero percent.
split_clients "$remote_addr$http_x_canary_bucket" $canary_variant {
    ${CANARY_SPLIT_PERCENT}% *canary;
    * "";
}
# --- canary end ---

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # nginx rejects request bodies over 1 MB by default, so a 2.5 MB law PDF came
    # back as 413 through the UI while the API accepted the same file on :8000.
    # Matched to LAW_API_MAX_UPLOAD_BYTES (50 MB) so the proxy is never the
    # tighter of the two limits.
    client_max_body_size 50m;
    client_body_buffer_size 1m;

    # Docker's embedded DNS. Used with variable-form proxy_pass below so a
    # missing canary container degrades to a 502 for that slice instead of
    # preventing nginx from starting at all.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # SSE: /ask/stream must not be buffered, or tokens arrive in one burst
        # at the end instead of progressively.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Variable form: resolution happens per request, so the frontend starts
        # cleanly with only the stable bento-api running.
        set $upstream http://bento-api:3000;

        # --- canary begin ---
        proxy_set_header X-Canary-Variant $canary_variant;
        if ($canary_variant = "canary") {
            set $upstream http://bento-canary:3000;
        }
        # --- canary end ---

        proxy_pass $upstream;
    }

    # Anything else is the SPA. Unknown paths fall back to index.html so client
    # side routing keeps working on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
