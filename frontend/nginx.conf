upstream bento_backend {
    server bento-api:3000 max_fails=0;
    keepalive 16;
}

# --- canary begin (removed by the entrypoint when CANARY_SPLIT_PERCENT=0) ---
# CANARY_SPLIT_PERCENT is substituted either way, but nginx REJECTS
# split_clients at exactly "0%" ("invalid percent value"), so this whole region is
# deleted when canary is disabled.
split_clients "$remote_addr$http_x_canary_bucket" $canary_variant {
    ${CANARY_SPLIT_PERCENT}% *canary;
    * "";
}
# --- canary end ---

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Match LAW_API_MAX_UPLOAD_BYTES (50 MB) so large PDF uploads never fail 413 at nginx.
    client_max_body_size 50m;
    client_body_buffer_size 1m;

    # --- canary begin ---
    # Docker's embedded DNS is only needed when canary routing dynamically chooses
    # between upstreams. With canary off, `upstream bento_backend` below resolves
    # once and avoids per-10s DNS timeouts under CPU load.
    resolver 127.0.0.11 valid=30s ipv6=off;
    # --- canary end ---

    location /api/ {
        # SSE: /ask/stream must not be buffered, or tokens arrive in one burst
        # at the end instead of progressively.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # --- nocanary begin ---
        proxy_pass http://bento_backend;
        # --- nocanary end ---

        # --- canary begin ---
        set $upstream http://bento_backend;
        proxy_set_header X-Canary-Variant $canary_variant;
        if ($canary_variant = "canary") {
            set $upstream http://bento-canary:3000;
        }
        proxy_pass $upstream;
        # --- canary end ---
    }

    # Anything else is the SPA. Unknown paths fall back to index.html so client
    # side routing keeps working on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
