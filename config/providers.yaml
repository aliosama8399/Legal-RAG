# Non-secret provider configuration.
# Override any value with the matching environment variable in .env.

storage:
  provider: qdrant-local # qdrant-local, qdrant, or postgresql
  qdrant:
    path: storage/qdrant
    url: ""
    collection: law_chunks
  postgresql:
    # Keep credentials in .env, not in this file.
    dsn: ""

embedding:
  name: arabert-all-nli-triplet-matryoshka # gate-arabert-v1, arabert-all-nli-triplet-matryoshka, or bge-m3

mlflow:
  tracking_uri: http://127.0.0.1:5001
  experiment: legal-rag-embeddings

llm:
  provider: ollama # openai, ollama, or local
  model: gemma4:31b-cloud   # with ollama this MUST be an ollama model (e.g. llama3.1 — see `ollama list`)
  base_url: "http://127.0.0.1:11434" # openai: self-hosted OpenAI-compatible server; ollama: Ollama host (default http://127.0.0.1:11434)
  temperature: 0.5
  max_tokens: 512

rag:
  top_k: 5

paths:
  upload_dir: storage/uploads
  pending_dir: storage/pending
  max_upload_bytes: 52428800
