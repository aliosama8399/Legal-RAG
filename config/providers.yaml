# Non-secret provider configuration.
# Override any value with the matching environment variable in .env.

storage:
  provider: qdrant-local # qdrant-local, qdrant, or postgresql
  qdrant:
    path: storage/qdrant
    url: ""
    collection: law_chunks
  postgresql:
    # Keep credentials in .env, not in this file.
    dsn: ""

embedding:
  name: arabert-all-nli-triplet-matryoshka # gate-arabert-v1, arabert-all-nli-triplet-matryoshka, or bge-m3

mlflow:
  tracking_uri: http://127.0.0.1:5000
  experiment: legal-rag-embeddings

llm:
  provider: vllm # openai, gemini, anthropic, claude, openrouter, groq, deepseek, vllm, ollama, local, or mock
  model: Qwen/Qwen2.5-1.5B-Instruct
  base_url: "http://127.0.0.1:8001/v1" # openai: "" | gemini/anthropic: native REST | openrouter/groq/deepseek/vllm: OpenAI-compat URL | ollama: http://127.0.0.1:11434
  temperature: 0.2
  max_tokens: 512

rag:
  top_k: 5
  rerank: true
  reranker: bge-reranker-base # bge-reranker-base (fast) or bge-reranker-v2-m3 (better, slower)
  rerank_candidates: 10
  rerank_max_length: 256

paths:
  upload_dir: storage/uploads
  pending_dir: storage/pending
  max_upload_bytes: 52428800

evaluation:
  # The GENERATION model is the model being evaluated; it also serves /ask.
  generation_provider: vllm # openai, gemini, anthropic, claude, openrouter, groq, deepseek, vllm, ollama, local, or mock
  generation_base_url: http://vllm:8000/v1
  generation_model: Qwen/Qwen2.5-1.5B-Instruct
  # The judge only scores answers during Ragas evaluation and /ask?evaluate=true.
  # Use e.g. openai/gpt-4o, gemini/gemini-2.5-flash, or claude/claude-3-5-sonnet-latest for frontier judging.
  judge_provider: vllm # openai, gemini, anthropic, claude, openrouter, groq, deepseek, vllm, ollama, local, or mock
  judge_base_url: http://vllm:8000/v1
  judge_model: Qwen/Qwen2.5-1.5B-Instruct
  # Where the eval job writes the newest Ragas scores. Read (read-only mount) by
  # the API so Prometheus can alert on it.
  scores_path: data/eval/latest_scores.json
  # Live per-request scores, written by the API itself. Deliberately NOT in
  # data/eval: that directory is mounted read-only into the serving container.
  live_scores_path: data/runtime/latest_live_eval.json

